services:
  - type: web
    name: aegisbank
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aegisbank-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "604800"
      - key: KYC_UPLOAD_DIR
        value: /tmp/aegisbank/kyc
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        value: ""
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"

databases:
  - name: aegisbank-db
    region: oregon
    plan: free
    databaseName: aegisbank
    user: aegisbank
